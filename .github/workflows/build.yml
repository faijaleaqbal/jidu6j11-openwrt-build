name: Build JIDU6J11-6111 OpenWrt

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Cache OpenWrt download dir
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ow-dl-${{ hashFiles('build.sh') }}
          restore-keys: ow-dl-

      - name: Checkout OpenWrt source (JIDU6J11-PR branch)
        uses: actions/checkout@v4
        with:
          repository: Sandiep/openwrt
          ref: JIDU6J11-PR
          path: openwrt
          fetch-depth: 1

      - name: Apply build patches
        run: |
          set -e
          cd openwrt

          # 1. The JIDU Wi-Fi BDFs (board-jiorouter_ax6000-jidu6j11.{ipq9574,qcn9074})
          #    are NOT in upstream project/firmware/qca-wireless at the pinned
          #    revision. They live only in Sandiep's fork branch JIDU6J11
          #    (upstream PR openwrt/firmware_qca-wireless#146 was closed, not
          #    merged). Point the ipq-wifi package at that fork.
          #
          #    Without this the per-model board-2.bin override is silently
          #    empty (the install-overlay globs board-<name>.* in the fetched
          #    tree) and Wi-Fi falls back to the generic IPQ9574 board data.
          sed -i \
            's|^PKG_SOURCE_URL=$(PROJECT_GIT)/project/firmware/qca-wireless.git|PKG_SOURCE_URL=https://github.com/Sandiep/firmware_qca-wireless.git|' \
            package/firmware/ipq-wifi/Makefile
          sed -i \
            's|^PKG_SOURCE_VERSION:=.*|PKG_SOURCE_VERSION:=a8974a05d1c6bc571a34f7e4ef858bc4689c402b|' \
            package/firmware/ipq-wifi/Makefile
          sed -i \
            's|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|' \
            package/firmware/ipq-wifi/Makefile

          # 2. Verify the patch actually landed. A sed that does not match is a
          #    silent no-op, and the BDF would then be missing while the build
          #    still reports success.
          if ! grep -q 'Sandiep/firmware_qca-wireless' package/firmware/ipq-wifi/Makefile; then
            echo "FATAL: ipq-wifi PKG_SOURCE_URL patch did not apply."
            grep -n 'PKG_SOURCE_URL\|PKG_SOURCE_VERSION\|PKG_MIRROR_HASH' package/firmware/ipq-wifi/Makefile
            exit 1
          fi
          if ! grep -q 'a8974a05d1c6bc571a34f7e4ef858bc4689c402b' package/firmware/ipq-wifi/Makefile; then
            echo "FATAL: ipq-wifi PKG_SOURCE_VERSION patch did not apply."
            exit 1
          fi
          echo "[+] ipq-wifi repointed to the JIDU BDF fork"

          # NOTE: no IMAGES tweak is needed for the initramfs FIT. OpenWrt
          # generates <profile>-initramfs-uImage.itb automatically from
          # Device/Build/initramfs whenever CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # (include/image.mk). Adding an explicit
          # "IMAGES += squashfs-initramfs-uImage.itb" would additionally emit a
          # SQUASHFS-rootfs-in-RAM variant, which is the wrong image for route A.

          # 3. Show what we changed
          git --no-pager diff --stat
          git --no-pager diff package/firmware/ipq-wifi/Makefile | head -40

      - name: Apply feature overlay
        run: |
          set -e
          # The feature overlay (ISP switcher, identity tool, boot guard,
          # first-boot defaults) is copied into the OpenWrt tree so it is
          # installed into the rootfs by the normal package machinery.
          cp -a "$GITHUB_WORKSPACE/files/." openwrt/files/
          chmod 0755 openwrt/files/usr/bin/jidu-isp.sh \
                      openwrt/files/usr/bin/jidu-identify.sh \
                      openwrt/files/etc/init.d/jidu-bootguard \
                      openwrt/files/etc/uci-defaults/99-jidu-first-boot
          echo "--- overlay installed ---"
          find openwrt/files -type f | sort

      - name: Lint feature overlay (shellcheck)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          echo "--- shellcheck ---"
          # shellcheck disable=SC1091
          shellcheck -s sh \
            files/usr/bin/jidu-isp.sh \
            files/usr/bin/jidu-identify.sh \
            files/etc/init.d/jidu-bootguard \
            files/etc/uci-defaults/99-jidu-first-boot
          echo "shellcheck: clean"
          echo "--- bash -n ---"
          for f in files/usr/bin/jidu-isp.sh files/usr/bin/jidu-identify.sh \
                   files/etc/init.d/jidu-bootguard files/etc/uci-defaults/99-jidu-first-boot; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget mtd-utils \
            libelf-dev ccache

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write device config
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_jiorouter_ax6000-jidu6j11-6111=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_INCLUDE_KERNEL=y
          CONFIG_TARGET_ROOTFS_DIR=""
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_ath11k-firmware-ipq9574=y
          CONFIG_PACKAGE_ath11k-firmware-qcn9074=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_kmod-ath11k-pci=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_uboot-envtools=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_luci-app-sqm-scripts=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_kmod-ledtrig-netdev=y
          CONFIG_PACKAGE_kmod-qcom-ppe=y
          CONFIG_PACKAGE_kmod-usb-dwc3=y
          CONFIG_PACKAGE_kmod-usb-dwc3-qcom=y
          EOF
          # make defconfig expands the seed into a full config
          make defconfig
          echo "--- resolved device ---"
          grep -E 'CONFIG_TARGET_qualcommbe|CONFIG_TARGET_ROOTFS' .config | head -20

          # HARD ASSERT. An unknown/typo'd Kconfig symbol is silently dropped by
          # defconfig, and the build then defaults to the FIRST device in
          # TARGET_DEVICES (8devices_kiwi-dvk) -- a successful build of the
          # wrong board. Fail loudly instead.
          echo "--- asserting the selected profile ---"
          if ! grep -q '^CONFIG_TARGET_PROFILE="DEVICE_jiorouter_ax6000-jidu6j11-6111"$' .config; then
            echo "FATAL: the 6111 device was not selected."
            echo "  CONFIG_TARGET_PROFILE = $(grep '^CONFIG_TARGET_PROFILE=' .config)"
            echo "  available profiles:"
            grep -oE 'DEVICE_[a-z0-9_-]+' .config | sort -u | head -20
            exit 1
          fi
          grep '^CONFIG_TARGET_PROFILE=' .config
          grep 'DEVICE_jiorouter_ax6000-jidu6j11-6111' .config

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -e
          make -j$(nproc) V=s 2>&1 | tail -200
          echo "=== artifacts ==="
          ls -la bin/targets/qualcommbe/ipq95xx/ || true

      - name: Build factory UBI (route A initramfs)
        working-directory: openwrt
        run: |
          set -e
          OUT=bin/targets/qualcommbe/ipq95xx
          cd "$OUT"

          # The initramfs FIT (kernel + RAM rootfs) is what route A boots. It is
          # generated automatically by Device/Build/initramfs whenever
          # CONFIG_TARGET_ROOTFS_INITRAMFS=y -- no IMAGES tweak needed.
          #
          # NOTE: do NOT glob loosely here. A profile can also emit a
          # "<fs>-initramfs-uImage.itb" variant (squashfs rootfs in RAM), and
          # "head -1" over a loose glob can pick that one instead -- it would
          # build a factory UBI around the wrong rootfs. Match exactly.
          ITB="openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-6111-initramfs-uImage.itb"
          if [ ! -f "$ITB" ]; then
            echo "ERROR: expected initramfs FIT not found: $ITB"
            echo "--- what IS in the output dir ---"
            ls -la
            exit 1
          fi
          echo "[+] initramfs FIT: $ITB"

          # END-TO-END ASSERT: the device tree compiled INTO this image must
          # name the 6111 profile. This proves the build targeted the right
          # board, not just that the build exited 0.
          if ! grep -aq 'jiorouter,ax6000-jidu6j11-6111' "$ITB"; then
            echo "FATAL: the built image does not contain the 6111 compatible string."
            echo "--- compatible strings actually present ---"
            strings "$ITB" | grep -ao 'jiorouter,[a-z0-9-]*' | sort -u | head
            strings "$ITB" | grep -ao 'qcom,ipq[0-9]*' | sort -u | head
            exit 1
          fi
          echo "[+] OK: image contains compatible jiorouter,ax6000-jidu6j11-6111"
          strings "$ITB" | grep -ao 'jiorouter,[a-z0-9,-]*' | sort -u | head

          # The Mayank SSH method boots the initramfs from a UBI container
          # with a single 'kernel' volume. Geometry must match the NAND:
          # 2 KiB page, 128 KiB eraseblock.
          cat > ubinize.cfg <<EOF
          [kernel]
          mode=ubi
          image=$ITB
          vol_id=0
          vol_name=kernel
          vol_type=dynamic
          vol_alignment=1
          vol_flags=autoresize
          EOF

          ubinize -o factory-initramfs.ubi -m 2048 -p 128KiB -s 2048 ubinize.cfg
          ls -la factory-initramfs.ubi

      - name: Collect and name artifacts
        working-directory: openwrt
        run: |
          set -e
          OUT=bin/targets/qualcommbe/ipq95xx
          cd "$OUT"
          STAGE=../../../../artifacts
          mkdir -p "$STAGE"

          # Canonical names the community flasher expects.
          # Match the 6111 profile exactly -- a loose glob could pick up a
          # different profile's image if more than one device were built.
          ITB="openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-6111-initramfs-uImage.itb"
          SYS="openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-6111-squashfs-sysupgrade.bin"
          for f in "$ITB" "$SYS"; do
            if [ ! -f "$f" ]; then
              echo "FATAL: expected artifact missing: $f"
              ls -la
              exit 1
            fi
          done

          cp "$ITB" "$STAGE/openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-initramfs-uImage.itb"
          cp "$SYS" "$STAGE/openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-squashfs-sysupgrade.bin"
          cp factory-initramfs.ubi "$STAGE/openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-initramfs-factory.ubi"
          # keep the raw build outputs too
          cp -a . "$STAGE/raw/" 2>/dev/null || true
          ls -la "$STAGE"

      - name: Feature tests (offline, mocked OpenWrt environment)
        run: |
          set -e
          python3 tests/test_features.py

      - name: End-to-end smoke test (simulated first boot)
        run: |
          set -e
          sh tests/smoke_test.sh

      - name: Verify rootfs contents (BDF + feature scripts)
        run: |
          set -e
          # Unpack the squashfs rootfs from the sysupgrade tar and prove that
          # the things that make this build WORK are actually inside it:
          #   - the per-model Wi-Fi board data (the BDF)
          #   - the feature scripts
          # A build where the ipq-wifi patch silently failed still produces
          # a bootable image - just with no Wi-Fi. This step is what
          # catches that.
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          SYSUP="$GITHUB_WORKSPACE/openwrt/bin/targets/qualcommbe/ipq95xx/openwrt-qualcommbe-ipq95xx-jiorouter_ax6000-jidu6j11-6111-squashfs-sysupgrade.bin"
          if [ ! -f "$SYSUP" ]; then
            echo "FATAL: sysupgrade image not found at $SYSUP"
            exit 1
          fi

          rm -rf rootfs-check
          mkdir -p rootfs-check
          cd rootfs-check

          # The sysupgrade tar has one directory member: <name>/CONTROL,
          # <name>/kernel and <name>/root. Pull the root member out.
          # --force-local so a path that looks like "host:path" is never
          # treated as a remote archive.
          MEMBER=$(tar tf "$SYSUP" --force-local | grep '/root$')
          echo "root member: $MEMBER"
          tar xf "$SYSUP" --force-local -O "$MEMBER" > rootfs.squashfs
          ls -la rootfs.squashfs
          # unsquashfs needs root to create device nodes (/dev/console),
          # so run it under sudo. The extracted tree is then directly
          # checkable with test -s / test -x.
          echo "--- privileged extract ---"
          sudo unsquashfs -d extracted rootfs.squashfs >/dev/null 2>&1 || {
            echo "FATAL: unsquashfs failed"
            exit 1
          }
          echo "--- Wi-Fi board data ---"
          ls -la extracted/lib/firmware/ath11k/IPQ9574/hw1.0/ 2>/dev/null || true
          ls -la extracted/lib/firmware/ath11k/QCN9074/hw1.0/ 2>/dev/null || true
          echo "--- feature scripts ---"
          ls -la extracted/usr/bin/jidu-isp.sh \
                 extracted/usr/bin/jidu-identify.sh \
                 extracted/etc/init.d/jidu-bootguard \
                 extracted/etc/uci-defaults/99-jidu-first-boot 2>/dev/null || true

          echo "--- assertions ---"
          fail=0

          # The BDF for this board MUST be present and non-empty.
          for f in extracted/lib/firmware/ath11k/IPQ9574/hw1.0/board-2.bin \
                   extracted/lib/firmware/ath11k/QCN9074/hw1.0/board-2.bin; do
            if [ ! -s "$f" ]; then
              echo "FATAL: Wi-Fi board data missing or empty: $f"
              fail=1
            else
              echo "ok  $f ($(stat -c %s "$f") bytes)"
            fi
          done

          # The feature scripts MUST be installed and executable.
          for f in extracted/usr/bin/jidu-isp.sh \
                   extracted/usr/bin/jidu-identify.sh \
                   extracted/etc/init.d/jidu-bootguard \
                   extracted/etc/uci-defaults/99-jidu-first-boot; do
            if [ ! -f "$f" ]; then
              echo "FATAL: feature file missing: $f"
              fail=1
            elif [ ! -x "$f" ]; then
              echo "FATAL: feature file not executable: $f"
              fail=1
            else
              echo "ok  $f ($(stat -c %s "$f") bytes)"
            fi
          done

          # Cross-check with the listing. Note the paths in the listing are
          # prefixed with the root directory name ("squashfs-root/..."), so
          # match on the path SUFFIX, as a plain string comparison.
          unsquashfs -ll rootfs.squashfs > listing.txt 2>/dev/null || true
          for p in lib/firmware/ath11k/IPQ9574/hw1.0/board-2.bin \
                   lib/firmware/ath11k/QCN9074/hw1.0/board-2.bin \
                   usr/bin/jidu-isp.sh \
                   usr/bin/jidu-identify.sh \
                   etc/init.d/jidu-bootguard \
                   etc/uci-defaults/99-jidu-first-boot; do
            if awk -v p="$p" '
                { f = $NF; sub(/^\.\//, "", f)
                  if (f == p) { found = 1; exit }
                  if (length(f) > length(p) &&
                      substr(f, length(f) - length(p)) == "/" p) { found = 1; exit } }
                END { exit found ? 0 : 1 }
            ' listing.txt; then
              echo "ok  listed: $p"
            else
              echo "FATAL: not in the listing: $p"
              fail=1
            fi
          done

          exit $fail

      - name: Acceptance tests (user point of view)
        run: |
          set -e
          # The artifacts are staged into openwrt/artifacts by the
          # "Collect and name artifacts" step.
          ARTIFACT_DIR="$GITHUB_WORKSPACE/openwrt/artifacts" \
            python3 tests/test_artifacts.py
        working-directory: .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jidu6j11-6111-openwrt
          path: openwrt/artifacts
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openwrt/artifacts/*
          body: |
            Custom OpenWrt build for JIDU6J11-6111 (Qualcomm IPQ9574 / `qualcommbe/ipq95xx`).

            Source: `Sandiep/openwrt` @ `JIDU6J11-PR` (upstream PR openwrt/openwrt#24432),
            with the `ipq-wifi` package pointed at `Sandiep/firmware_qca-wireless` @ `JIDU6J11`
            so the per-model JIDU Wi-Fi BDF is actually installed.

            Flash route A (SSH) files:
            - `...-initramfs-factory.ubi`  -> write to the IDLE A/B slot, then `fw_setenv` bootcmd
            - `...-squashfs-sysupgrade.bin` -> run `sysupgrade` from the initramfs
